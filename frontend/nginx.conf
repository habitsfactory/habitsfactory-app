server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/ requests to the backend container (internal Docker network only)
    location /api/ {
        proxy_pass         http://habitsfactory_backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy Django admin to backend (internal only)
    location /admin/ {
        proxy_pass         http://habitsfactory_backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy Django static files served by WhiteNoise via backend
    location /static/ {
        proxy_pass http://habitsfactory_backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fingerprinted build output (JS, CSS, fonts): safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The service worker and the files it checks for updates must never be
    # served stale, or installed apps would stay on an old version.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "SAMEORIGIN"     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html for Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
