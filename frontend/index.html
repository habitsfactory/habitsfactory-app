<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo_edition.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Habits Factory — daily evolution, quantified." />
  <meta name="theme-color" content="#1490c9" />
  <title>Habits Factory</title>
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      try {
        var stored = localStorage.getItem('darkMode')
        var dark = stored !== null ? stored === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) { }
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
