services:
  db:
    image: postgres:16-alpine
    container_name: habitsfactory_db
    environment:
      POSTGRES_DB: ${DB_NAME:-habitsfactory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-habitsfactory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ghcr.io/habitsfactory/habitsfactory-app-backend:${TAG:-latest}
    container_name: habitsfactory_migrate
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-habitsfactory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"
    restart: "no"

  backend:
    image: ghcr.io/habitsfactory/habitsfactory-app-backend:${TAG:-latest}
    container_name: habitsfactory_backend
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      SECRET_KEY: ${SECRET_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_NAME: ${DB_NAME:-habitsfactory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      TZ: ${TZ:-UTC}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 120 --access-logfile - --error-logfile - app.wsgi:application
    restart: unless-stopped

  frontend:
    image: ghcr.io/habitsfactory/habitsfactory-app-frontend:${TAG:-latest}
    container_name: habitsfactory_frontend
    ports:
      - "8084:80"
    depends_on:
      - backend
    restart: unless-stopped

  scheduler:
    # Runs the correlation job once on startup, then every 24 hours.
    image: ghcr.io/habitsfactory/habitsfactory-app-backend:${TAG:-latest}
    container_name: habitsfactory_scheduler
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-habitsfactory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "while true; do
        python manage.py compute_correlations;
        sleep 86400;
      done"
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:
  media:
