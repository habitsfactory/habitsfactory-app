services:
  db:
    image: postgres:16-alpine
    container_name: habitsfactory_db
    environment:
      POSTGRES_DB: ${DB_NAME:-habitsfactory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-habitsfactory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ghcr.io/habitsfactory/habitsfactory-app-backend:${TAG:-latest}
    container_name: habitsfactory_migrate
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-habitsfactory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput"
    restart: "no"

  backend:
    image: ghcr.io/habitsfactory/habitsfactory-app-backend:${TAG:-latest}
    container_name: habitsfactory_backend
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      SECRET_KEY: ${SECRET_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_NAME: ${DB_NAME:-habitsfactory}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      TZ: ${TZ:-UTC}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout 120 --access-logfile - --error-logfile - app.wsgi:application
    restart: unless-stopped

  frontend:
    image: ghcr.io/habitsfactory/habitsfactory-app-frontend:${TAG:-latest}
    container_name: habitsfactory_frontend
    ports:
      - "8084:5173"
    depends_on:
      - backend
    restart: unless-stopped

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: habitsfactory_scheduler
    depends_on:
      - backend
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-exec.compute-correlations.schedule: "0 0 2 * * *"
      ofelia.job-exec.compute-correlations.container: "habitsfactory_backend"
      ofelia.job-exec.compute-correlations.command: "python manage.py compute_correlations"
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:
  media:
